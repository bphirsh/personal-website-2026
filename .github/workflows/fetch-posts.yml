name: Fetch Substack Posts

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS feed
        run: |
          curl -s -L --max-time 30 \
            -A "Mozilla/5.0 (compatible; feed-fetcher)" \
            "https://brianhirsh.substack.com/feed" \
            -o feed.xml
          echo "Feed size: $(wc -c < feed.xml) bytes"

      - name: Parse RSS into posts.json
        run: python3 .github/scripts/parse_feed.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "chore: refresh Substack posts cache"
          git push

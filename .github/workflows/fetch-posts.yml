name: Fetch Substack Posts

on:
  workflow_dispatch:   # manual trigger only — Substack blocks scheduled CI IPs

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS feed
        run: |
          curl -s -L --max-time 30 \
            -A "Mozilla/5.0 (compatible; feed-fetcher)" \
            "https://brianhirsh.substack.com/feed" \
            -o feed.xml
          echo "Feed size: $(wc -c < feed.xml) bytes"
          # Verify we got XML, not an error page
          head -c 100 feed.xml | grep -q '<?xml' || { echo "ERROR: did not receive XML"; cat feed.xml | head -20; exit 1; }

      - name: Parse RSS into posts.json
        run: python3 .github/scripts/parse_feed.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "chore: refresh Substack posts cache"
          git push
